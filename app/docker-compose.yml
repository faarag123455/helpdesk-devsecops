services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: fake-db-password-123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - helpdesk_postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: helpdesk-app:latest
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_DEBUG: "1"
      SECRET_KEY: local-development-secret
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: helpdesk
      DB_USER: helpdesk
      DB_PASSWORD: fake-db-password-123
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - postgres

volumes:
  helpdesk_postgres_data:
