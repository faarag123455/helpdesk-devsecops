{% extends "base.html" %}
{% block title %}New ticket - HelpDesk{% endblock %}
{% block content %}
<div class="narrow-layout">
  <p class="eyebrow">NEW REQUEST</p>
  <h1>Create a ticket</h1>
  <p class="muted">Tell us what happened and we’ll help you move forward.</p>
  <form class="card form-card" method="post">
    <label for="title">Title</label>
    <input id="title" name="title" maxlength="200" placeholder="What do you need help with?" required>
    <label for="description">Description</label>
    <textarea id="description" name="description" placeholder="Add useful context, steps, and expected results." required></textarea>
    <label for="priority">Priority</label>
    <select id="priority" name="priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button class="button button-primary" type="submit">Create ticket</button>
  </form>
</div>
{% endblock %}
