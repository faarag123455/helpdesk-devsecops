{% extends "base.html" %}
{% block title %}Users - HelpDesk{% endblock %}
{% block content %}
<header class="page-header">
  <div>
    <p class="eyebrow">ADMINISTRATION</p>
    <h1>Users</h1>
    <p class="muted">Manage workspace roles.</p>
  </div>
</header>
<section class="ticket-grid">
  {% for user in users %}
    <article class="card ticket-card">
      <h2>{{ user.username }}</h2>
      <p class="muted">{{ user.email }}</p>
      <form method="post" action="{{ url_for('update_user_role', user_id=user.id) }}">
        <label for="role-{{ user.id }}">Role</label>
        <select id="role-{{ user.id }}" name="role">
          {% for role in ['user', 'agent', 'admin'] %}
            <option value="{{ role }}" {% if role == user.role %}selected{% endif %}>{{ role }}</option>
          {% endfor %}
        </select>
        <button class="button button-secondary" type="submit">Update role</button>
      </form>
    </article>
  {% endfor %}
</section>
{% endblock %}
