{% extends "base.html" %}
{% block title %}Register - HelpDesk{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-intro">
    <p class="eyebrow">GET STARTED</p>
    <h1>A calmer way to handle support.</h1>
    <p class="lead">Create your workspace account and turn every request into a clear next step.</p>
  </div>
  <div class="card form-card">
    <h2>Create an account</h2>
    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" required>
      <button class="button button-primary" type="submit">Create account</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
