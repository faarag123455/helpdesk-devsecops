{% extends "base.html" %}
{% block title %}Log in - HelpDesk{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-intro">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Keep your support work moving.</h1>
    <p class="lead">Sign in to track requests, collaborate with your team, and keep every customer informed.</p>
  </div>
  <div class="card form-card">
    <h2>Log in</h2>
    <form method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button class="button button-primary" type="submit">Log in</button>
    </form>
    <p class="form-footer">New to HelpDesk? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
