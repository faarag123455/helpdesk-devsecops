# Gitleaks configuration for the HelpDesk project.
# It keeps ALL default rules and adds one rule: hardcoded credentials.
# Why: default rules look for known vendor formats (AWS, GitHub...) or very
# random strings. Fake/readable secrets such as SECRET_KEY = "fake-secret-key-123"
# are invisible to them, but they are exactly VULN-5 of this project.

title = "HelpDesk gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "helpdesk-hardcoded-credential"
description = "Hardcoded credential (secret key, token, password) assigned as a literal value"
# Matches:  NAME = "value"   NAME: "value"   NAME: value   (value >= 8 chars)
# NAME contains: secret_key, secret_access_key, api_token, api_key, password, passwd, token
regex = '''(?im)(?:secret_key|secret_access_key|api_token|api_key|password|passwd|token)["']?\s*[:=]\s*(?:["']([^"'\s]{8,})["']|([A-Za-z0-9_\-\.@!%^&*+/]{8,})\s*$)'''
keywords = ["secret_key", "secret_access_key", "api_token", "api_key", "password", "passwd", "token"]
secretGroup = 0

[rules.allowlist]
description = "Values that are references, not literals (env vars, CI variables)"
regexes = [
  '''\$\{?[A-Za-z_]''',
  '''os\.environ''',
  '''getenv''',
  '''secretKeyRef''',
]

[allowlist]
description = "Files that legitimately talk about secrets"
paths = [
  '''\.gitleaks\.toml$''',
  '''\.gitlab-ci\.yml$''',
]
